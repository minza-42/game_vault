<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching GameVault dark theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Controller Fill Gradient -->
    <linearGradient id="controllerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Effect for Controller -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Card / Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Border Accent -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3" />

  <!-- Main Gamepad Icon -->
  <g filter="url(#shadow)">
    <!-- Controller Main Body -->
    <path d="M 160 160 
             C 210 150, 302 150, 352 160 
             C 400 170, 440 220, 425 300 
             C 415 350, 375 365, 345 335 
             C 325 315, 295 295, 256 295 
             C 217 295, 187 315, 167 335 
             C 137 365, 97 350, 87 300 
             C 72 220, 112 170, 160 160 Z" fill="url(#controllerGrad)" filter="url(#purpleGlow)" />

    <!-- D-Pad (Left Side) -->
    <g fill="#ffffff" opacity="0.95">
      <rect x="156" y="210" width="16" height="44" rx="4" />
      <rect x="142" y="224" width="44" height="16" rx="4" />
    </g>

    <!-- Action Buttons (Right Side) -->
    <circle cx="356" cy="204" r="10" fill="#f59e0b" />
    <circle cx="376" cy="224" r="10" fill="#ec4899" />
    <circle cx="356" cy="244" r="10" fill="#10b981" />
    <circle cx="336" cy="224" r="10" fill="#3b82f6" />
  </g>
</svg>